apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sylvatwin-webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nidar53/sylvatwin-poc.git
    targetRevision: main
    path: git-desired
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: {}
