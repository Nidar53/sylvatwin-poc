apiVersion: apps/v1
kind: Deployment
metadata:
  name: nrf
  labels: {app.kubernetes.io/name: nrf, app.kubernetes.io/part-of: sylvatwin-5gc, sylvatwin.orange.com/nf: nrf}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: nrf}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nrf, app.kubernetes.io/part-of: sylvatwin-5gc, sylvatwin.orange.com/nf: nrf}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nrf
          image: gradiant/open5gs:2.7.2
          command: ["open5gs-nrfd", "-c", "/etc/open5gs/custom/nrf.yaml"]
          ports:
            - {name: sbi, containerPort: 7777, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: 7777}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /etc/open5gs/custom}
      volumes:
        - name: config
          configMap: {name: nrf-config}
---
apiVersion: v1
kind: Service
metadata:
  name: nrf
  labels: {app.kubernetes.io/name: nrf, app.kubernetes.io/part-of: sylvatwin-5gc}
spec:
  selector: {app.kubernetes.io/name: nrf}
  ports:
    - {name: sbi, port: 7777, targetPort: 7777, protocol: TCP}
