apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels: {app.kubernetes.io/name: mongodb, app.kubernetes.io/part-of: sylvatwin-5gc}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: mongodb}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mongodb, app.kubernetes.io/part-of: sylvatwin-5gc}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongodb
          image: mongo:6.0
          args: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - {name: mongo, containerPort: 27017, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 500m, memory: 768Mi}
          readinessProbe:
            tcpSocket: {port: 27017}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data/db}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mongodb-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels: {app.kubernetes.io/name: mongodb, app.kubernetes.io/part-of: sylvatwin-5gc}
spec:
  selector: {app.kubernetes.io/name: mongodb}
  ports:
    - {name: mongo, port: 27017, targetPort: 27017, protocol: TCP}
